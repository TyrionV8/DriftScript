[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "driftscript"
version = "0.1.0"
description = "Descript-style text-based video editor addon and MCP server for CutWire Drift"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Davi Monteiro Alves" }
]
dependencies = [
  "fastapi>=0.100.0",
  "uvicorn>=0.23.0",
  "pydantic>=2.0.0",
  "numpy>=1.24.0",
  "torch>=2.0.0",
  "faster-whisper>=1.0.0",
  "whisperx>=3.1.0"
]

[project.scripts]
driftscript = "driftscript.server:main"
driftscript-mcp = "driftscript.mcp_server:run_stdio_server"
